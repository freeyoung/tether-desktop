name: CI

# Linux vets the app and builds the Windows exe, which needs no cgo. The
# macOS app uses cgo with AppKit, so only a macOS runner can build it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vet, and build for Windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod

      # The engine and its tests are in github.com/freeyoung/tether-core-go.
      - name: Vet
        working-directory: go
        run: |
          test -z "$(gofmt -l cmd)" || { gofmt -l cmd; exit 1; }
          GOOS=windows GOARCH=amd64 go vet ./cmd/tetherdesktop

      - name: Build for Windows
        run: scripts/build-windows.sh

  mac:
    name: Build for macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod

      # Signed ad hoc: the signing certificate is only for releases.
      - name: Build
        run: |
          go -C go vet ./cmd/tetherdesktop
          scripts/build-macos.sh
          codesign --verify --strict build/TetherDesktop.app
