<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .glyph { fill: none; stroke: #1f6feb; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .name { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .note { fill: #59636e; font-size: 13px; }
    .link { stroke: #1f6feb; stroke-width: 2.5; fill: none; }
    .phone-link { stroke: #59636e; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .label { fill: #1f6feb; font-size: 13px; font-weight: 600; }
    .phone-label { fill: #59636e; font-size: 13px; font-weight: 600; }
    .bt-link { stroke: #8250df; stroke-width: 2.5; stroke-dasharray: 2 5; stroke-linecap: round; fill: none; }
    .bt-label { fill: #8250df; font-size: 13px; font-weight: 600; }
    .halo { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .glyph { stroke: #4493f8; }
      .name { fill: #f0f6fc; }
      .note { fill: #9198a1; }
      .link { stroke: #4493f8; }
      .phone-link { stroke: #9198a1; }
      .label { fill: #4493f8; }
      .phone-label { fill: #9198a1; }
      .bt-link { stroke: #ab7df8; }
      .bt-label { fill: #ab7df8; }
      .halo { fill: #0d1117; }
    }
  </style>

  <!-- The iPhone connects to one of the devices at a time. -->
  <path class="phone-link" d="M 335 120 L 95 230"/>
  <path class="phone-link" d="M 365 120 L 285 230"/>
  <path class="phone-link" d="M 395 120 L 475 230"/>
  <path class="phone-link" d="M 425 120 L 665 230"/>
  <rect class="halo" x="292" y="158" width="176" height="40" rx="4"/>
  <text class="phone-label" x="380" y="174" text-anchor="middle">to one device at a time:</text>
  <text class="phone-label" x="380" y="192" text-anchor="middle">clipboard, files, links</text>

  <!-- Bluetooth: only tetherd (BlueZ) has it. -->
  <path class="bt-link" d="M 455 60 C 640 60, 700 120, 700 230"/>
  <rect class="halo" x="550" y="88" width="196" height="40" rx="4"/>
  <text class="bt-label" x="648" y="104" text-anchor="middle">Bluetooth, tetherd only:</text>
  <text class="bt-label" x="648" y="122" text-anchor="middle">messages, notifications, calls</text>

  <!-- The devices with the engine and tetherd share the clipboard and files. -->
  <path class="link" d="M 170 285 L 210 285"/>
  <path class="link" d="M 360 285 L 400 285"/>
  <path class="link" d="M 550 285 L 590 285"/>
  <path class="link" d="M 95 340 Q 380 420 665 340"/>
  <rect class="halo" x="318" y="368" width="124" height="22" rx="4"/>
  <text class="label" x="380" y="384" text-anchor="middle">clipboard and files</text>

  <!-- iPhone -->
  <rect class="box" x="305" y="10" width="150" height="110" rx="14"/>
  <rect class="glyph" x="366" y="26" width="28" height="48" rx="6"/>
  <text class="name" x="380" y="96" text-anchor="middle">iPhone</text>
  <text class="note" x="380" y="113" text-anchor="middle">Tether app</text>

  <!-- Mac -->
  <rect class="box" x="20" y="230" width="150" height="110" rx="14"/>
  <rect class="glyph" x="73" y="246" width="44" height="30" rx="4"/>
  <path class="glyph" d="M 95 276 V 286 M 83 289 H 107"/>
  <text class="name" x="95" y="316" text-anchor="middle">Mac</text>
  <text class="note" x="95" y="333" text-anchor="middle">Tether Desktop</text>

  <!-- Windows PC -->
  <rect class="box" x="210" y="230" width="150" height="110" rx="14"/>
  <rect class="glyph" x="263" y="246" width="44" height="30" rx="4"/>
  <path class="glyph" d="M 285 276 V 286 M 273 289 H 297"/>
  <text class="name" x="285" y="316" text-anchor="middle">Windows PC</text>
  <text class="note" x="285" y="333" text-anchor="middle">Tether Desktop</text>

  <!-- Android phone -->
  <rect class="box" x="400" y="230" width="150" height="110" rx="14"/>
  <rect class="glyph" x="461" y="244" width="28" height="46" rx="6"/>
  <text class="name" x="475" y="316" text-anchor="middle">Android</text>
  <text class="note" x="475" y="333" text-anchor="middle">Tether for Android</text>

  <!-- Linux -->
  <rect class="box" x="590" y="230" width="150" height="110" rx="14"/>
  <rect class="glyph" x="643" y="246" width="44" height="30" rx="4"/>
  <path class="glyph" d="M 665 276 V 286 M 653 289 H 677"/>
  <text class="name" x="665" y="316" text-anchor="middle">Linux</text>
  <text class="note" x="665" y="333" text-anchor="middle">tetherd</text>
</svg>
